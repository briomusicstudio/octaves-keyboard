<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>КЛАВІАТУРА · Brio Music Studio</title>
<link rel="icon" href="logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;800&subset=cyrillic&display=swap" rel="stylesheet">
<style>
:root{--bg:radial-gradient(circle at 15% 0,#7b6bff55,transparent 45%),radial-gradient(circle at 90% 100%,#ff6ec755,transparent 45%),linear-gradient(160deg,#0b0a2a,#1d1458 60%,#2e1670);
--tx:#fff;--tx2:#d6d1fa;--ye:#ffd54a;--cy:#4de0ff;--dk:#2a1050;--ft:#a9a2e0;--act:linear-gradient(135deg,#6a4cff,#c0309a);
--glass:rgba(255,255,255,.08);--line:rgba(255,255,255,.12);--ok:#14803f;--no:#b3261e;
--pad:36px;--w:1440px;--kh:184px;--rc:26px;--wk:#f6f3ff;--wl:#c9c0ee;--vi:#5a2a8a;--g:160ms;--ocmin:0px}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{font:600 16px/1.4 Manrope,system-ui,sans-serif;color:var(--tx);background:var(--bg);background-attachment:fixed;min-height:100vh;display:flex;flex-direction:column}
a{color:inherit}
:where(a,button,select,input,[tabindex]):focus-visible{outline:3px solid var(--ye);outline-offset:2px}
button,.oc,.wk{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.w{max-width:var(--w);margin:0 auto;padding-inline:var(--pad)}
.menuBtn{display:none}.menuWrap{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.hd{background:rgba(255,255,255,.06);border-bottom:1px solid var(--line)}
.hi{max-width:var(--w);margin:0 auto;padding:14px var(--pad);display:flex;align-items:center;gap:18px}
.logo{font:800 22px Manrope;letter-spacing:2px;text-decoration:none;background:linear-gradient(90deg,#4de0ff,#ff6ec7);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
nav{display:flex;gap:6px;flex:1;min-width:0}
nav a{font:800 15px Manrope;padding:10px 14px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;flex:1;text-align:center;border-radius:14px;color:var(--tx2);text-decoration:none;white-space:nowrap;scroll-snap-align:start;transition:background var(--g),color var(--g)}
nav a:hover{background:rgba(255,255,255,.12);color:#fff}
nav a[aria-current]{background:var(--act);color:#fff}
.ctl{display:flex;align-items:center;gap:14px;margin-left:auto}
.lang{position:relative}.lang::after{content:'▾';position:absolute;right:12px;top:50%;transform:translateY(-50%);pointer-events:none;font-size:12px}
.lang select{appearance:none;-webkit-appearance:none;background:rgba(255,255,255,.06);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:14px;padding:0 32px 0 14px;min-height:44px;font:800 15px Manrope;cursor:pointer;color-scheme:dark}.lang select option{background:#1d1458;color:#fff}
.vol{display:flex;align-items:center;gap:8px;font:800 14px Manrope}
.vol input{-webkit-appearance:none;appearance:none;width:96px;height:44px;background:none;cursor:pointer;margin:0}
.vol input::-webkit-slider-runnable-track{height:6px;border-radius:6px;background:linear-gradient(90deg,#6a4cff,#c0309a) 0 0/var(--v,60%) 100% no-repeat,rgba(255,255,255,.25)}
.vol input::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;margin-top:-7px;box-shadow:0 2px 6px rgba(0,0,0,.45)}
.vol input::-moz-range-track{height:6px;border-radius:6px;background:rgba(255,255,255,.25)}
.vol input::-moz-range-progress{height:6px;border-radius:6px;background:linear-gradient(90deg,#6a4cff,#c0309a)}
.vol input::-moz-range-thumb{width:20px;height:20px;border:0;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.45)}
/* titles */
.ph{text-align:center;padding-top:26px;padding-bottom:20px}
h1{font:800 46px/1.15 Manrope}
.gt{background:linear-gradient(90deg,#ffd54a,#ff8fb8);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--tx2);font-size:16px;margin-bottom:18px}.ph .sub{font-size:18px;margin:10px 0 0}
main{flex:1}
/* keyboard */
.strip{margin:8px clamp(10px,1.5vw,16px);padding:18px 12px 14px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.15);border-radius:20px;overflow-x:auto;overscroll-behavior-x:contain;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.octs{display:grid;grid-template-columns:repeat(7,minmax(var(--ocmin),1fr))}
  .oc{display:flex;flex-direction:column;cursor:pointer;position:relative;border-radius:10px;align-items:stretch}
  .pill{align-self:center;margin-bottom:6px;font:800 13px Manrope;color:#fff;padding:6px 12px;border-radius:99px;background:linear-gradient(90deg,var(--c1),var(--c2));transition:transform var(--g),box-shadow var(--g);white-space:nowrap;will-change:transform}
  .octname{align-self:center;margin-bottom:8px;font:800 13px Manrope;padding:6px 14px;border-radius:99px;white-space:nowrap;transition:transform var(--g),font-size var(--g);will-change:transform;font-size:13px;position:relative;z-index:2;background:linear-gradient(90deg,#4d8dff,#7b9dff,#bfbf5a,#ffd54a,#ffb74a,#ff8fb8,#ff6ec7,#b86bff,#9b6bff);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.2);background-size:300% 100%;background-position:calc(var(--og)*1%) 0}
  .octname{align-self:center;margin-bottom:8px;font:800 13px Manrope;color:#fff;padding:6px 14px;border-radius:99px;background:linear-gradient(90deg,var(--c1),var(--c2));white-space:nowrap;transition:transform var(--g),box-shadow var(--g),font-size var(--g);will-change:transform;font-size:13px;position:relative;z-index:2}
  .kb{display:flex;height:var(--kh);position:relative;transition:filter var(--g)}
  .wk{flex:1;position:relative;background:var(--wk);border-right:1px solid var(--wl);border-radius:0 0 5px 5px}
  .wk:first-child{border-radius:0 0 5px 12px}.wk:last-child{border-radius:0 0 12px 5px;border-right:0}
  .wk.in{background:linear-gradient(#cdbdff,#a995f5)}
  .bk{position:absolute;top:0;left:67%;width:66%;height:64%;z-index:2;background:linear-gradient(180deg,#3a2a8a,#0b0a2a);border-radius:0 0 6px 6px;box-shadow:0 3px 6px rgba(0,0,0,.4)}
  .lb{position:absolute;left:0;right:0;bottom:8px;text-align:center;font:800 12px Manrope;color:var(--vi);opacity:0;transition:opacity var(--g);pointer-events:none;white-space:nowrap}
  .wk:first-child .lb{opacity:1}
  .tag{margin:8px 6px 0;padding-top:4px;border-top:3px solid var(--ye);text-align:center;font:800 12px Manrope;color:var(--ye);visibility:hidden}
  .nt .tag{display:none}.hp .pill{visibility:hidden}
  .oc.act,.oc.sel{z-index:3}
  .oc.act .kb,.oc.sel .kb{filter:drop-shadow(0 0 16px rgba(255,213,74,.85))}
  .oc.act .pill,.oc.sel .pill,.oc:hover .pill{transform:scale(1.12)}
  .oc.act .octname,.oc:hover .octname{transform:scale(1.16);font-size:14px;box-shadow:0 4px 12px rgba(255,213,74,.4)}
  .oc.act .lb,.oc.sel .lb{opacity:1}.oc.act .tag,.oc.sel .tag{visibility:visible}
  .oc.good .kb{filter:drop-shadow(0 0 16px #3ddc84)}.oc.bad .kb{filter:drop-shadow(0 0 16px #ff5a5a)}
.mini{height:90px}
.scale{display:flex;align-items:center;gap:14px;padding-top:12px;font:800 14px Manrope;color:#e9e0ff}
.scale i{flex:1;height:3px;border-radius:3px;background:linear-gradient(90deg,#4d8dff,#ffd54a,#ff6ec7)}
.touch{display:none;font-size:14px;color:var(--tx2);margin-top:8px;text-align:center}
/* home */
.def{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;max-width:760px;margin:0 auto 16px;padding:20px 28px;border-radius:var(--rc);background:linear-gradient(180deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.03) 100%);border:1px solid rgba(255,255,255,.18);box-shadow:0 12px 28px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.15);backdrop-filter:blur(8px)}
.def b{font:800 24px/1.2 Manrope;letter-spacing:3px;color:var(--cy);white-space:nowrap}
.def p{font-size:17px;line-height:1.6;color:var(--tx);margin:0;text-align:center}
.def em{font-style:normal;color:var(--ye);font-weight:800}
.hint{text-align:center;font-size:14px;color:var(--tx2);margin:0 0 14px}
.h-m{display:inline}.h-t{display:none}
@media(hover:none),(pointer:coarse),(max-width:767px){.h-m{display:none}.h-t{display:inline}}
.ch{margin-top:26px;padding-bottom:36px}
.chr{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.chr h2{font:800 19px Manrope}.prg{display:flex;align-items:center;gap:10px;font:800 14px Manrope;color:#e9e0ff}
.dots{display:flex;gap:8px}.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.3)}.dots i.on{background:var(--ye)}
.cards{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 1fr;gap:14px}
.cc{position:relative;display:flex;flex-direction:column;min-height:170px;padding:18px 20px;border-radius:var(--rc);box-shadow:0 12px 28px rgba(0,0,0,.35);text-decoration:none;color:#fff;transition:transform var(--g),filter var(--g)}
.cc:hover{transform:translateY(-4px);filter:brightness(1.1)}
.ic{width:54px;height:54px;border-radius:18px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:28px;margin-bottom:12px}
.cc h3{font:800 19px Manrope}.cc p{font-size:14px;line-height:1.4;margin-top:4px;padding-right:34px}
.ar{position:absolute;right:18px;bottom:14px;font:800 22px Manrope}
.c0{background:linear-gradient(135deg,#ffd54a,#ff8fb8);color:var(--dk)}.c0 h3{font-size:23px}.c0 p{font-size:15px}
.c1{background:linear-gradient(135deg,#1b46c8,#2f6be0)}.c2{background:linear-gradient(135deg,#4b2ab8,#7a3fe0)}.c3{background:linear-gradient(135deg,#2a5fb0,#6a3fe0)}.c4{background:linear-gradient(135deg,#a0287e,#cf3f6a)}
.rec{position:absolute;top:14px;right:16px;background:var(--dk);color:#fff;font:800 12px Manrope;padding:5px 12px;border-radius:99px}
/* panels, quiz */
.panel{margin-top:6px;margin-bottom:6px;background:var(--glass);border:1px solid rgba(255,255,255,.18);border-radius:var(--rc);padding:28px clamp(16px,4vw,44px);box-shadow:0 12px 28px rgba(0,0,0,.35);backdrop-filter:blur(8px)}
.w:has(>.panel):last-child{padding-bottom:36px}
.qtop{display:flex;justify-content:space-between;gap:10px;font:800 15px Manrope;color:var(--tx2);margin-bottom:10px}
.score b{margin-left:8px;padding:3px 12px;border-radius:99px}.g{background:rgba(61,220,132,.2);color:#9ff0c4}.r{background:rgba(255,90,90,.2);color:#ffb4b4}
.bar{height:8px;background:rgba(255,255,255,.18);border-radius:9px;overflow:hidden;margin-bottom:24px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#4de0ff,#ff6ec7);transition:width .4s}
.qh{font:800 clamp(20px,3vw,30px)/1.25 Manrope;text-align:center;margin-bottom:22px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}.opts.wide{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.opt{font:800 18px Manrope;min-height:60px;padding:16px 14px;border-radius:18px;border:2px solid rgba(255,255,255,.22);background:var(--glass);color:#fff;cursor:pointer;transition:transform var(--g),background var(--g),border-color var(--g)}
.opt:hover{transform:translateY(-4px);background:rgba(255,255,255,.16);border-color:var(--ye)}
.opt *{pointer-events:none}.opt.good{background:var(--ok);border-color:#3ddc84}.opt.bad{background:var(--no);border-color:#ff8a80;animation:sh .4s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.btn{border:0;cursor:pointer;font:800 17px Manrope;color:#fff;padding:12px 30px;min-height:44px;border-radius:99px;background:var(--act);box-shadow:0 8px 20px rgba(192,48,154,.4);transition:transform var(--g);text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.btn:hover{transform:translateY(-3px)}.btn.alt{background:var(--glass);border:1px solid rgba(255,255,255,.3);box-shadow:none}
.tools,.gor,.btns{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:0 0 18px}
.rs-panel{max-width:520px;margin:12px auto 28px;padding:34px 26px;box-shadow:0 16px 36px rgba(0,0,0,.35)}
.find-panel{padding:22px 28px;margin:12px auto 18px;max-width:640px}
.find-panel .qtop{margin-bottom:10px}
.find-panel .bar{height:7px;margin-bottom:16px}
.find-panel .qh{font-size:28px;margin-bottom:6px;color:var(--ye)}
.find-panel .sub{font-size:15px;margin-bottom:14px}
.find-panel .tools{margin:0}
.btn-sm{min-height:38px;padding:8px 24px;font-size:15px}
.order-panel{max-width:680px;margin:12px auto 18px;padding:22px 28px;text-align:center}
.order-desc{font:700 18px/1.5 Manrope;color:#fff;margin:0 0 16px}
.order-top{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:14px;flex-wrap:wrap}
.order-step{font:700 15px Manrope;color:var(--tx2)}
.rs{display:flex;flex-direction:column;align-items:center;text-align:center}
.stars{display:flex;justify-content:center;align-items:center;gap:10px;margin:8px 0 16px}
.star{width:40px;height:40px;fill:rgba(255,255,255,.14);stroke:rgba(255,255,255,.28);stroke-width:1.5;stroke-linejoin:round;transition:transform .3s,fill .3s}
.star.on{fill:var(--ye);stroke:#e5b300;filter:drop-shadow(0 0 12px rgba(255,213,74,.65));animation:starPop .4s cubic-bezier(.34,1.56,.64,1) backwards}
.star.on:nth-child(1){animation-delay:.05s}.star.on:nth-child(2){animation-delay:.12s}.star.on:nth-child(3){animation-delay:.19s}.star.on:nth-child(4){animation-delay:.26s}.star.on:nth-child(5){animation-delay:.33s}
@keyframes starPop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.22)}100%{transform:scale(1);opacity:1}}
.rs-score{font:800 22px/1.2 Manrope;color:var(--ye);letter-spacing:1px;margin-bottom:8px}
.rs p{font:700 18px/1.5 Manrope;color:#fff;margin:0 0 24px;max-width:440px}
.bigs{font:800 48px/1.1 Manrope;color:var(--ye)}
.chips{display:flex;gap:8px;flex-wrap:wrap}.tools .chips,.chips.c{justify-content:center}
.chip{border:2px solid rgba(255,255,255,.3);background:transparent;color:#fff;border-radius:99px;padding:8px 18px;min-height:44px;font:800 15px Manrope;cursor:pointer}.chip.on{background:var(--act);border-color:transparent}
.setup{max-width:560px;margin:auto}.setup h3{font:800 18px Manrope;margin:18px 0 10px}
.setup input[type=number]{width:90px;padding:9px;border-radius:12px;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font:800 16px Manrope}
.own{margin-top:12px}
.sw{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;background:var(--glass);margin-top:10px;cursor:pointer;font-size:15px}.sw input{width:22px;height:22px;accent-color:#c0309a;flex:none}
.gor{margin:26px 0 0}.gor .btn{font-size:22px;padding:14px 46px}
.hud{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.timer{font:800 34px Manrope;background:rgba(0,0,0,.35);padding:4px 26px;border-radius:99px;min-width:130px;text-align:center}.timer.low{background:var(--no);animation:pl 1s infinite}@keyframes pl{50%{opacity:.7}}
.target{font:800 clamp(22px,4vw,36px) Manrope;padding:14px 30px;border-radius:22px;background:var(--glass);border:2px solid rgba(255,255,255,.22);text-align:center;width:fit-content;margin:0 auto}.target em{font-style:normal;color:var(--ye)}
.jg{display:flex;justify-content:center;gap:30px;margin:20px 0 0}.jg button{width:100px;height:100px;border-radius:50%;border:0;cursor:pointer;font-size:46px;color:#fff;box-shadow:0 12px 24px rgba(0,0,0,.3);transition:transform .15s}.jg button:active{transform:scale(.92)}
.modal{position:fixed;inset:0;z-index:90;background:rgba(11,10,42,.78);display:grid;place-items:center;padding:16px}.modal .panel{background:#1d1458;max-width:520px;width:100%;text-align:center}
.mc{text-align:center;margin-top:8px}.mn{color:var(--tx2);font-size:15px}.big{font:800 clamp(34px,6vw,52px)/1.15 Manrope;margin:6px 0 10px;background:linear-gradient(90deg,#ffd54a,#ff8fb8);-webkit-background-clip:text;background-clip:text;color:transparent}.mn b{color:var(--ye);font-size:22px}.mc .tools{margin:16px 0 0}
.slots{list-style:none;padding:0;display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:6px 0 4px}
.slots li{min-height:64px;border-radius:14px;border:2px dashed rgba(255,255,255,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 14px Manrope;text-align:center;padding:4px}.slots li span{font-size:12px;color:var(--tx2)}.slots li.f{border:2px solid #3ddc84;background:rgba(61,220,132,.18)}
.chips.c{margin-top:20px}.chips.c .opt{min-width:150px}
/* footer */
footer{padding:30px 16px 24px;text-align:center;font-size:12px;color:var(--ft)}
.soc{display:flex;justify-content:center;gap:12px;margin-top:12px}.soc a{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid rgba(255,255,255,.2);color:var(--tx2);transition:transform var(--g),background var(--g)}.soc a:hover{background:var(--act);color:#fff;transform:translateY(-3px)}
.soc svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#fb{position:fixed;inset:0;z-index:100;display:none;place-items:center;pointer-events:none}#fb.show{display:grid}
#fb svg{width:170px;height:170px;filter:drop-shadow(0 12px 24px rgba(0,0,0,.35));animation:pop 1s forwards}
#fb path{stroke-dasharray:60;stroke-dashoffset:60;animation:dr .45s .15s forwards}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes pop{0%{transform:scale(0)}25%{transform:scale(1.15)}40%,75%{transform:scale(1)}100%{transform:scale(1.4);opacity:0}}
#fb.x svg{animation:xs .9s forwards}@keyframes xs{0%{transform:scale(0)}20%{transform:scale(1.2)}35%{transform:scale(1.2) translateX(-16px)}50%{transform:scale(1.2) translateX(16px)}100%{transform:scale(1);opacity:0}}
/* responsive */
@media(max-width:1199px){:root{--pad:24px;--ocmin:150px}.cards{grid-template-columns:repeat(2,1fr)}.c0{grid-column:1/-1}}
@media(max-width:767px){:root{--pad:16px;--ocmin:240px}h1{font-size:32px}.def{padding:16px 18px}.def b{font-size:20px}.def p{font-size:15px}.cards{grid-template-columns:1fr}.touch{display:block}.hi{gap:10px;position:relative}.vol input{width:80px}.slots{grid-template-columns:repeat(4,1fr)}.bigs{font-size:48px}.star{width:32px;height:32px}.stars{gap:6px}.rs-panel{padding:26px 18px}.rs-score{font-size:20px}.rs p{font-size:16px}
.menuBtn{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.06);color:#fff;font:800 22px Manrope;cursor:pointer;margin-left:auto}
.menuWrap{display:none;position:absolute;top:100%;right:0;left:auto;padding:12px var(--pad);background:rgba(29,20,88,.98);border-bottom:1px solid var(--line);border-left:1px solid var(--line);flex-direction:column;gap:12px;z-index:50;backdrop-filter:blur(10px);min-width:260px;text-align:left}
.hd.open .menuWrap{display:flex}
.menuWrap nav{display:flex;flex-direction:column;gap:6px;order:1}
.menuWrap .ctl{display:flex;flex-direction:column;gap:10px;order:2;margin-left:0}
.menuWrap nav a{width:100%} }
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.cc:hover,.opt:hover,.btn:hover,.soc a:hover{transform:none!important}}
</style>
</head>
<body>
<header class="hd"><div class="hi">
<a class="logo" href="#/">КЛАВІАТУРА</a><button class="menuBtn" id="menubtn" aria-label="Меню" aria-expanded="false">☰</button>
  <div class="menuWrap">
  <nav id="nav"></nav>
  <div class="ctl"><div class="lang"><select id="lang"><option value="uk">UK</option><option value="ru">RU</option><option value="en">EN</option></select></div>
  <label class="vol"><span id="vl"></span><input id="vol" type="range" min="0" max="100" value="60" style="--v:60%"></label></div>
 </div>

</div></header>
<main id="pv"></main>
<div id="fb" aria-hidden="true"></div>
<footer>

/* Тести */
function res(ok,tot,again,id){
 const idx=IDS.indexOf(id),nextId=(idx>=0&&idx<IDS.length-1)?IDS[idx+1]:'home';
 const stars=Math.round(ok/tot*5);
 const msg=ok/tot>=.9?t('p1'):ok/tot>=.6?t('p2'):t('p3');
 pg().innerHTML=W(`<div class="panel rs-panel"><div class="rs">
  ${starsHtml(stars)}
  <div class="rs-score">${t('of',{a:ok,b:tot})}</div>
  <p>${msg}</p>
  <div class="btns">
   <a class="btn" href="#/${nextId==='home'?'':nextId}">${t('nextSec')} →</a>
   <button class="btn alt" id="ag">${t('again')}</button>
   <a class="btn alt" href="#/">${t('back')}</a>
  </div>
 </div></div>`);
 $('#ag').onclick=again;$('#ag').focus();if(ok/tot>=.6){done(id);arp(4)}}
const mk=(q,c,w)=>{const o=sh([c,...w]);return{q,opts:o,a:o.indexOf(c)}};
function run(it,again,id,cls='',al=0){let i=0,ok=0,bad=0,lock=0;const R=pg();(function d(){if(i>=it.length)return res(ok,it.length,again,id);const q=it[i];
 R.innerHTML=PN(`<div class="qtop"><span>${t('qn',{a:i+1,b:it.length})}</span>${score(ok,bad)}</div><div class="bar"><i style="width:${i/it.length*100}%"></i></div><h2 class="qh">${q.q}</h2><div class="opts ${cls}">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}"${al?` aria-label="${t('opt',{n:k+1})}"`:''}>${o}</button>`).join('')}</div>`);
 const bs=R.querySelectorAll('.opt');bs.forEach(b=>b.onclick=()=>{if(lock)return;lock=1;const g=+b.dataset.k===q.a;b.classList.add(g?'good':'bad');bs[q.a].classList.add('good');g?ok++:bad++;fb(g);setTimeout(()=>{i++;lock=0;d()},1400)})})()}
function quiz1(){const n=NN(),sq=a=>a.map(i=>n[i]).join(' ');
 run([mk(t('a1'),'7',['5','8','12']),mk(t('a2',{x:n[0],y:n[4]}),t('no2'),[t('yes2')]),mk(t('a3'),sq([0,1,2,3,4,5,6]),[sq([0,2,1,3,4,6,5]),sq([1,2,3,4,5,6,0]),sq([0,1,2,4,3,5,6])]),mk(t('a4'),n[0],[n[1],n[5],n[6]]),mk(t('a5'),n[6],[n[0],n[4],n[1]])],quiz1,'check')}
function quiz2(){const it=[],n=NN();for(let r=0;r<5;r++){const c=Math.random()<.5?0:7,all=sh([c,...sh([1,2,3,4,5,6]).slice(0,2)]);
 it.push({q:t('b1',{x:n[0],y:n[6]}),opts:all.map(s=>mini(s,s+6)),a:all.indexOf(c)})}
 run(it,quiz2,'limits','wide',1)}
function quiz3(){const ord=sh([0,1,2,3,4,5,6]);let i=0,ok=0,bad=0,lock=0;const R=pg();
 (function d(){if(i>=7)return res(ok,7,quiz3,'find');const a=ord[i];
   R.innerHTML=W(`<div class="panel find-panel"><div class="qtop"><span>${t('qn',{a:i+1,b:7})}</span>${score(ok,bad)}</div><div class="bar"><i style="width:${i/7*100}%"></i></div><h2 class="qh">${t('fNames')[a]}</h2><p class="sub" style="text-align:center">${t('f2')}</p><div class="tools"><button class="btn alt btn-sm" id="hint">${t('hint')}</button></div></div>`)+strip({btn:1,nt:1,hp:1,noname:1})+`<p class="touch w">${t('swipe')}</p>`;
  $('#hint').onclick=()=>$('.strip').classList.toggle('hp');
  wire($('.strip'),o=>{if(lock)return;lock=1;const n=+o.dataset.o,g=n===a;o.classList.add(g?'good':'bad');if(!g)R.querySelector(`.oc[data-o="${a}"]`).classList.add('good');g?ok++:bad++;arp(n);fb(g);setTimeout(()=>{i++;lock=0;d()},1500)})})()}
/* Порядок */
function memo(m=0){const R=pg();
 if(!m){
  R.innerHTML=W(`<div class="panel order-panel"><p class="order-desc">${t('orderDesc')}</p><div class="tools" style="margin:0"><button class="btn" id="startOrder">${t('orderBtn')} →</button></div></div>`)+strip({btn:1})+`<p class="touch w">${t('swipe')}</p>`;
  $('#startOrder').onclick=()=>memo(1);
  wire(R.querySelector('.strip'),o=>arp(+o.dataset.o),1);
 }else{let e=0,er=0;const ch=sh([0,1,2,3,4,5,6]),paint=()=>{
  R.innerHTML=W(`<div class="panel order-panel"><div class="order-top"><button class="btn alt btn-sm" id="backKb">${t('orderKb')}</button><span class="order-step">${t('mtask')}</span></div><ol class="slots">${[...Array(7)].map((_,k)=>`<li class="${k<e?'f':''}"><span>${k+1}</span>${k<e?ON()[k]:''}</li>`).join('')}</ol><div class="scale"><span>${t('lo')}</span><i></i><span>${t('hi')}</span></div><div class="chips c">${ch.filter(x=>x>=e).map(x=>`<button class="opt" data-o="${x}">${ON()[x]}</button>`).join('')}</div></div>`);
  $('#backKb').onclick=()=>memo(0);
  R.querySelectorAll('.chips .opt').forEach(b=>b.onclick=()=>{const o=+b.dataset.o;if(o==e){e++;arp(o);if(e==7){done('memo');fb(true);
   const stars=er===0?5:er===1?4:er<=3?3:er<=5?2:1;
   const msg=er===0?t('p1'):er<=2?t('p2'):t('p3');
   R.innerHTML=W(`<div class="panel rs-panel"><div class="rs">
    ${starsHtml(stars)}
    <div class="rs-score">${t('mdone',{e:er})}</div>
    <p>${msg}</p>
    <div class="btns">
     <a class="btn" href="#/find">${t('nextSec')} →</a>
     <button class="btn alt" id="ag">${t('again')}</button>
     <a class="btn alt" href="#/">${t('back')}</a>
    </div>
   </div></div>`);$('#ag').onclick=()=>memo(1);$('#ag').focus();return}paint();R.querySelector('.chips .opt')?.focus()}else{er++;note(2,1,0,.3);b.classList.add('bad');setTimeout(()=>b.classList.remove('bad'),450)}})};paint()}}
/* Гра на швидкість */
let G={sec:60,online:true,acc:false};
const nm=(k,a)=>a?(L=='en'?NN()[k]+(a>0?'♯':'♭'):NN()[k]+'-'+t(a>0?'sharp':'flat')):NN()[k];
function setup(){const R=pg();R.innerHTML=PN(`<div class="setup"><h3>${t('gtime')}</h3><div class="chips">${[30,60,120,180].map((s,i)=>`<button class="chip${s==G.sec?' on':''}" data-s="${s}">${t('cs')[i]}</button>`).join('')}</div>
 <p class="own"><label>${t('gown')} <input type="number" id="cs" min="10" max="900" value="${G.sec}"> ${t('sec')}</label></p>
 <h3>${t('gmode')}</h3><label class="sw"><input type="checkbox" id="onl" ${G.online?'checked':''}> ${t('gonl')}</label><label class="sw"><input type="checkbox" id="acc" ${G.acc?'checked':''}> ${t('gacc')}</label>
 <div class="gor"><button class="btn" id="go">${t('go')}</button></div></div>`);
 R.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{$('#cs').value=c.dataset.s;R.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x==c))});
 $('#go').onclick=()=>{G.sec=Math.max(10,Math.min(900,+$('#cs').value||60));G.online=$('#onl').checked;G.acc=$('#acc').checked;play()}}
function tm(s){if(s%60)return s+' '+t('sec');const m=s/60;return L=='uk'?(m==1?'1 хвилину':m<5?m+' хвилини':m+' хвилин'):L=='ru'?(m==1?'1 минуту':m<5?m+' минуты':m+' минут'):m+(m==1?' minute':' minutes')}
function play(){const R=pg();let ok=0,bad=0,T=null,fin=0;const end=Date.now()+G.sec*1e3;
   R.innerHTML=PN(`<div class="hud"><div class="timer" id="tmr" role="timer"></div><span id="sc"></span><button class="btn alt" id="stop">${t('stop')}</button></div><div class="target" id="tg" aria-live="polite"></div>${G.online?'':'<div class="jg"><button id="yes" style="background:#14803f" aria-label="✓">✓</button><button id="no" style="background:#b3261e" aria-label="✗">✗</button></div>'}`)+(G.online?strip({nt:1,noname:1})+`<p class="touch w">${t('swipe')}</p>`:'');
 const gen=()=>{let n;do{const o=Math.random()*7|0;if(G.acc&&Math.random()<.70){const k=[0,1,3,4,5][Math.random()*5|0],f=Math.random()<.5;n={o,s:BS[k],b:1,k:f?k+1:k,a:f?-1:1}}else{const k=Math.random()*7|0;n={o,k,s:WS[k],b:0,a:0}}}while(T&&n.o==T.o&&n.s==T.s);return n},
 nx=()=>{T=gen();$('#tg').innerHTML=t('tg',{n:'<em>'+nm(T.k,T.a)+'</em>',o:OG()[T.o]});$('#sc').innerHTML=score(ok,bad)},
 ans=g=>{if(fin)return;g?ok++:bad++;g?fb(true,false):fb(false);nx()};nx();
if(G.online)$('.strip').onclick=e=>{const k=e.target.closest('.bk,.wk');if(!k||fin)return;const o=+k.closest('.oc').dataset.o;
   if(k.classList.contains('bk')){const correct=G.acc&&o==T.o&&+k.dataset.s==T.s;if(correct)note(o,+k.dataset.s);return ans(correct)}
   const correct=!T.b&&o==T.o&&+k.dataset.n==T.k;if(correct)note(o,WS[+k.dataset.n]);ans(correct)};
 else{$('#yes').onclick=()=>ans(1);$('#no').onclick=()=>ans(0)}
 const end_=()=>{if(fin)return;fin=1;clearInterval(iv);done('speed');const m=document.createElement('div');m.className='modal';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');
  const stars=(bad==0&&ok>=10)?5:(ok>=bad*3&&ok>0)?4:(ok>=bad&&ok>0)?3:ok>0?2:1;
  const msg=bad==0&&ok>0?t('g1'):ok>=bad*3&&ok>0?t('g2'):t('g3');
  m.innerHTML=`<div class="panel rs-panel" style="max-width:520px;width:100%"><div class="rs">
   <h2 class="qh" style="margin-bottom:6px">${t('up')}</h2>
   ${starsHtml(stars)}
   <div class="rs-score" style="font-size:18px">${t('res',{t:tm(G.sec),n:ok,e:bad})}</div>
   <p>${msg}</p>
   <div class="btns" style="margin:20px 0 0">
    <a class="btn" href="#/">${t('nextSec')} →</a>
    <button class="btn alt" id="again">${t('again2')}</button>
    <button class="btn alt" id="chg">${t('set')}</button>
   </div>
  </div></div>`;
  document.body.appendChild(m);if(ok>bad)arp(4);$('#again').focus();$('#again').onclick=()=>{m.remove();play()};$('#chg').onclick=()=>{m.remove();setup()}};
 const iv=setInterval(()=>{const l=Math.max(0,Math.ceil((end-Date.now())/1e3)),e=$('#tmr');if(!e)return clearInterval(iv);e.textContent=Math.floor(l/60)+':'+String(l%60).padStart(2,'0');e.classList.toggle('low',l<=10);if(l<=0)end_()},200);
 $('#stop').onclick=()=>{fin=1;clearInterval(iv);setup()}}
/* мова та старт */
function setLang(l){L=l;try{localStorage.setItem('brio-lang',l)}catch(e){}document.documentElement.lang=l;$('#lang').value=l;
 $('#lang').setAttribute('aria-label',t('lng'));$('#vol').setAttribute('aria-label',t('vol'));$('#vl').innerHTML='🔊';$('.logo').textContent=t('brand');
 $('#nav').setAttribute('aria-label',t('menu'));$('#nav').innerHTML=t('nav').map((x,i)=>`<a href="#/${i?IDS[i]:''}">${x}</a>`).join('');render()}
$('#lang').onchange=e=>setLang(e.target.value);
const mb=$('#menubtn');if(mb)mb.onclick=()=>{const hd=$('.hd');const o=hd.classList.toggle('open');mb.setAttribute('aria-expanded',o?'true':'false');mb.textContent=o?'✕':'☰'};
addEventListener('hashchange',()=>{render();scrollTo(0,0);const hd=$('.hd');hd.classList.remove('open');const mb=$('#menubtn');if(mb){mb.setAttribute('aria-expanded','false');mb.textContent='☰'}});
let L0='uk';try{L0=localStorage.getItem('brio-lang')||L0}catch(e){}
setLang(LG[L0]?L0:'uk');
</script>
</body>
</html>
